image:
  provider: undecided        # decided with Eran before stage 7
  max_retries_per_ad: 2

overlay:
  # Headline font on the ad images. Eran will pick the final font.
  # Either a Google Fonts family, or a file in assets/fonts/ (then set `file`).
  headline_font: {family: "Frank Ruhl Libre", weight: 300, google: true, file: null}
  sub_font: {family: "Heebo", weight: 300, google: true, file: null}
  brand_font: {family: "Frank Ruhl Libre", weight: 500, google: true, file: null}
