filter:
  min_active_ads: 2
  max_active_ads: 150        # above this it's probably a big advertiser
  max_page_likes: 200000
  # Ad CTA types that point to a lead-gen/service funnel rather than a store
  leadgen_ctas: [SIGN_UP, APPLY_NOW, GET_QUOTE, BOOK_TRAVEL, CONTACT_US, SUBSCRIBE, DOWNLOAD, WATCH_MORE, BOOK_NOW, GET_OFFER_VIEW]
  shop_ctas: [SHOP_NOW, ORDER_NOW, BUY_NOW, GET_OFFER]
  accepted_currencies: [ILS]
  # Big chains / known brands — never leads
  brand_blocklist:
