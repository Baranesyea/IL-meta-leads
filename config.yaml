image:
  provider: undecided        # decided with Eran before stage 7
  max_retries_per_ad: 2

overlay:
  # Eran's fonts (assets/fonts). Optimum = all ad typography (3 weights for contrast play);
  # Idealist = handwriting: designer signature / short personal note only.
  fonts:
    light:   FbOptimum-Light.otf
    regular: FbOptimum-Regular.otf
    black:   FbOptimum-Black.otf
    script:  FbIdealist-Regular.otf
  default_signature: ""       # per lead: business owner's first name, e.g. "סתיו"
