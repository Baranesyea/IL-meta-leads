# Ad Lead Engine — runtime config

daily_target: 10          # leads that must reach "researched" per day
country: IL

discovery:
  # Which backend "python run.py discover" uses:
  #   mcp_import  - read JSON dumps of Meta Ads MCP `ads_library_search` results
  #                 from data/raw/discover/ (Claude Code runs the MCP, saves the dump)
  #   apify       - Apify "Facebook Ads Library Scraper" (needs APIFY_TOKEN in .env)
  backend: playwright
  apify_actor: curious_coder~facebook-ads-library-scraper
  max_ads_per_keyword: 120
  # WhatsApp track: phrases that ads with a "send WhatsApp message" button use; only those ads are kept
  wa_keywords:
    - וואטסאפ
    - שלחו הודעה
    - שלחו לנו הודעה
    - דברו איתנו
    - לפרטים בוואטסאפ
    - להזמנה בוואטסאפ
    - הזמנות בוואטסאפ
    - שלחו וואטסאפ
    - כתבו לנו
    - בהודעה פרטית
    - הצעת מחיר
    - לתיאום
    - תכשיטים בהזמנה אישית
    - עוגות מעוצבות
    - מגשי אירוח
    - זרי פרחים
    - מארזי מתנה
    - רהיטים
    - מזרנים
    - ריהוט גן
    - שמלות ערב
